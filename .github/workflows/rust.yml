name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: RustUp
      run: rustup target add thumbv8m.main-none-eabihf 
    - name: Cargo build
      run: cargo build --verbose
   # - name: Run tests
  #  run: cargo test --verbose
